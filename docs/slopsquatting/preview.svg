<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Slopsquatting and HalluSquatting threat research</title>
  <desc id="description">An AI-generated package name leads to an attacker-controlled package in a software registry.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset=".55" stop-color="#182945"/>
      <stop offset="1" stop-color="#301d3d"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65d9ca"/>
      <stop offset=".55" stop-color="#aa8cff"/>
      <stop offset="1" stop-color="#ff6688"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#background)"/>
  <g fill="none" stroke="#7d91af" stroke-opacity=".12">
    <path d="M0 122h640M0 202h640M0 282h640"/>
    <path d="M92 98v220M212 98v220M332 98v220M452 98v220M572 98v220"/>
  </g>

  <g transform="translate(70 133)">
    <rect width="116" height="92" rx="16" fill="#122536" stroke="#65d9ca" stroke-width="2"/>
    <path d="M30 45c0-18 13-31 30-31 14 0 25 8 29 21 12 1 21 10 21 22 0 13-10 23-24 23H32C18 80 8 70 8 57c0-11 9-21 22-22" fill="none" stroke="#65d9ca" stroke-width="3"/>
    <path d="m48 42 11 10-11 10m20 0h16" fill="none" stroke="#d9fff9" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  </g>

  <g transform="translate(262 133)">
    <path d="m58 0 51 29v58l-51 29L7 87V29Z" fill="#211d3c" stroke="#aa8cff" stroke-width="2"/>
    <path d="m7 29 51 30 51-30M58 59v57" fill="none" stroke="#aa8cff" stroke-width="2"/>
    <text x="58" y="48" fill="#f0eaff" font-family="monospace" font-size="28" text-anchor="middle">?</text>
    <path d="M29 78h58" stroke="#f0eaff" stroke-linecap="round" stroke-width="3"/>
  </g>

  <g transform="translate(456 133)">
    <rect width="116" height="92" rx="12" fill="#321b31" stroke="#ff6688" stroke-width="2"/>
    <path d="M18 29h80M18 47h80M18 65h80" stroke="#ff6688" stroke-opacity=".5"/>
    <path d="M29 17h58l11 12H18Z" fill="#ff6688" fill-opacity=".18" stroke="#ff6688" stroke-width="2"/>
    <path d="M58 38 75 68H41Z" fill="#ff6688" filter="url(#glow)"/>
    <path d="M58 48v10m0 5v1" stroke="#fff" stroke-linecap="round" stroke-width="3"/>
  </g>

  <g fill="none" stroke="url(#flow)" stroke-linecap="round" stroke-width="4">
    <path d="M191 179h61"/>
    <path d="M382 179h64"/>
  </g>
  <g fill="url(#flow)">
    <path d="m252 179-12-8v16Z"/>
    <path d="m446 179-12-8v16Z"/>
