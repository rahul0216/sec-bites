  <text x="42" y="52" fill="#fff" font-family="Georgia,serif" font-size="25">SLOPSQUATTING / HALLUSQUATTING</text>
  <text x="44" y="79" fill="#b9c7dc" font-family="monospace" font-size="12" letter-spacing="3">AI PACKAGE HALLUCINATION RESEARCH</text>
  <text x="42" y="326" fill="#65d9ca" font-family="monospace" font-size="10" letter-spacing="2">HALLUCINATION → REGISTRATION → RETRIEVAL</text>
