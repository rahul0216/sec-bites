<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title description">
  <title id="title">Weaponized Claude Code extension: attempted SSH backdoor</title>
  <desc id="description">A modified extension delivered through Cursor's marketplace executes a prepended loader. Branches collect metadata, add an SSH key, attempt service setup, and write persistence. A reverse tunnel and accepted SSH authentication are prerequisites for possible remote access. Successful attacker sessions are not established by the reviewed sources.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 5 L0 10 Z" fill="#536477"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b43; }
      .title { font-size: 36px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #526277; }
      .label { font-size: 23px; font-weight: 650; }
      .body { font-size: 21px; }
      .small { font-size: 18px; fill: #526277; }
      .badge { font-size: 18px; font-weight: 650; fill: #35516c; }
      .number { font-size: 19px; font-weight: 700; fill: #ffffff; }
      .node { stroke-width: 2; rx: 16; }
      .setup { fill: #e8f2ff; stroke: #4a90e2; }
      .execution { fill: #edf7e8; stroke: #67a84b; }
      .capability { fill: #fff5d9; stroke: #d99a00; }
      .gap { fill: #f1f3f5; stroke: #7a8288; }
      .edge { fill: none; stroke: #536477; stroke-width: 2.5; marker-end: url(#arrow); }
      .uncertain { stroke-dasharray: 8 6; }
      .icon { fill: none; stroke: #35516c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <symbol id="package" viewBox="0 0 32 32"><path class="icon" d="M4 9 16 3 28 9 28 23 16 29 4 23ZM4 9 16 15 28 9M16 15V29M10 6 22 12"/></symbol>
    <symbol id="code" viewBox="0 0 32 32"><path class="icon" d="M10 8 3 16 10 24M22 8 29 16 22 24M19 5 13 27"/></symbol>
    <symbol id="key" viewBox="0 0 32 32"><circle class="icon" cx="10" cy="11" r="7"/><path class="icon" d="M15 16 28 29M21 22 25 18M25 26 29 22"/></symbol>
    <symbol id="server" viewBox="0 0 32 32"><rect class="icon" x="4" y="4" width="24" height="10" rx="2"/><rect class="icon" x="4" y="18" width="24" height="10" rx="2"/><path class="icon" d="M9 9H10M9 23H10M16 9H23M16 23H23"/></symbol>
    <symbol id="clock" viewBox="0 0 32 32"><circle class="icon" cx="16" cy="16" r="12"/><path class="icon" d="M16 8V16L22 20"/></symbol>
  </defs>
  <rect width="1800" height="1320" fill="#ffffff"/>
  <text x="64" y="65" class="title">A trusted extension. An attempted persistent SSH backdoor.</text>
  <text x="64" y="105" class="subtitle">Claude Code 2.1.313 through Cursor's marketplace | October 29, 2026 exposure window</text>

  <rect x="64" y="150" width="470" height="135" class="node setup"/>
  <circle cx="92" cy="180" r="16" fill="#35516c"/><text x="92" y="187" text-anchor="middle" class="number">1</text>
  <use href="#package" x="484" y="169" width="30" height="30"/>
  <text x="121" y="188" class="label">Modified package delivered</text>
  <text x="88" y="226" class="body">Cursor marketplace, not Open VSX</text>
  <text x="88" y="260" class="badge">ATT&amp;CK T1195.002</text>

  <rect x="664" y="150" width="470" height="135" class="node execution"/>
  <circle cx="692" cy="180" r="16" fill="#35516c"/><text x="692" y="187" text-anchor="middle" class="number">2</text>
  <use href="#code" x="1084" y="169" width="30" height="30"/>
  <text x="721" y="188" class="label">Extension entry point loads</text>
  <text x="688" y="226" class="body">No Claude conversation required</text>
  <text x="688" y="260" class="small">Runtime trigger, not an install hook</text>

  <rect x="1264" y="150" width="470" height="135" class="node execution"/>
  <circle cx="1292" cy="180" r="16" fill="#35516c"/><text x="1292" y="187" text-anchor="middle" class="number">3</text>
  <use href="#code" x="1684" y="169" width="30" height="30"/>
  <text x="1321" y="188" class="label">Prepended loader executes</text>
  <text x="1288" y="226" class="body">66 lines before the normal bundle</text>
  <text x="1288" y="260" class="small">Errors suppressed; extension can work</text>
  <path d="M534 217H654" class="edge"/>
  <path d="M1134 217H1254" class="edge"/>
  <path d="M1499 285V345H249V374" class="edge"/>
  <path d="M679 345V374" class="edge"/>
  <path d="M1109 345V374" class="edge"/>
  <path d="M1499 345H1539V374" class="edge"/>
  <text x="64" y="317" class="small">Reported loader branches; layout does not assert an exact order between branches</text>

  <rect x="64" y="384" width="370" height="175" class="node execution"/>
  <circle cx="92" cy="414" r="16" fill="#35516c"/><text x="92" y="421" text-anchor="middle" class="number">4</text>
  <text x="121" y="422" class="label">Collect host metadata</text>
  <text x="88" y="463" class="body">Host, OS, user, paths, Git email</text>
  <text x="88" y="495" class="body">Environment-variable names</text>
  <text x="88" y="535" class="badge">T1082 / T1033</text>

  <rect x="494" y="384" width="370" height="175" class="node capability"/>
  <circle cx="522" cy="414" r="16" fill="#35516c"/><text x="522" y="421" text-anchor="middle" class="number">5</text>
  <use href="#key" x="811" y="402" width="30" height="30"/>
  <text x="551" y="422" class="label">Add unauthorized key</text>
  <text x="518" y="463" class="body">User's SSH authorized_keys</text>
  <text x="518" y="495" class="body">Comment: svc-telemetry</text>
  <text x="518" y="535" class="badge">T1098.004</text>

  <rect x="924" y="384" width="370" height="175" class="node capability"/>
  <circle cx="952" cy="414" r="16" fill="#35516c"/><text x="952" y="421" text-anchor="middle" class="number">6</text>
  <use href="#server" x="1241" y="402" width="30" height="30"/>
  <text x="981" y="422" class="label">Attempt SSH setup</text>
  <text x="948" y="463" class="body">Enable or start local SSH</text>
  <text x="948" y="495" class="body">Privilege and code constraints</text>
  <text x="948" y="535" class="badge">Shell / PowerShell code paths</text>

  <rect x="1354" y="384" width="380" height="175" class="node capability"/>
  <circle cx="1382" cy="414" r="16" fill="#35516c"/><text x="1382" y="421" text-anchor="middle" class="number">7</text>
  <use href="#clock" x="1681" y="402" width="30" height="30"/>
  <text x="1411" y="422" class="label">Startup persistence</text>
  <text x="1378" y="463" class="body">macOS: user LaunchAgent</text>
  <text x="1378" y="495" class="body">Windows: task / Startup script</text>
  <text x="1378" y="535" class="small">Linux: cron branch; delivery unverified</text>

  <path d="M249 559V604" class="edge"/>
  <rect x="64" y="614" width="370" height="160" class="node execution"/>
  <circle cx="92" cy="644" r="16" fill="#35516c"/><text x="92" y="651" text-anchor="middle" class="number">8</text>
  <text x="121" y="652" class="label">Send HTTP beacon</text>
  <text x="88" y="695" class="body">134.209.82.225:8099/beacon</text>
  <text x="88" y="727" class="body">Also attempts loopback beacon</text>
  <text x="88" y="757" class="small">Success depends on request delivery</text>

  <path d="M1109 559V604" class="edge"/>
  <rect x="924" y="614" width="370" height="160" class="node capability"/>
  <circle cx="952" cy="644" r="16" fill="#35516c"/><text x="952" y="651" text-anchor="middle" class="number">9</text>
  <text x="981" y="652" class="label">Attempt reverse tunnel</text>
  <text x="948" y="695" class="body">Outbound SSH to attacker host</text>
  <text x="948" y="727" class="body">Forward back to local port 22</text>
  <text x="948" y="757" class="badge">T1572 | retries ~60 seconds</text>

  <rect x="64" y="834" width="600" height="170" class="node gap"/>
  <text x="88" y="875" class="label">What the beacon does not prove</text>
  <text x="88" y="918" class="body">Variable names are not secret values.</text>
  <text x="88" y="952" class="body">No additional download identified in this stage.</text>
  <text x="88" y="985" class="small">Later credential access requires separate evidence.</text>
  <path d="M249 774V824" class="edge"/>

  <path d="M679 559V906H879" class="edge"/>
  <text x="694" y="813" class="small">Key must be accepted</text>
  <path d="M1109 774V804" class="edge"/>
  <polygon points="1109,814 1329,906 1109,998 889,906" class="capability" stroke-width="2"/>
  <text x="1109" y="873" text-anchor="middle" class="label">All prerequisites met?</text>
  <text x="1109" y="908" text-anchor="middle" class="body">Working tunnel + local SSH</text>
  <text x="1109" y="941" text-anchor="middle" class="body">+ accepted authentication</text>

  <path d="M1329 906H1410" class="edge"/>
  <text x="1342" y="883" class="small">No</text>
  <rect x="1420" y="834" width="314" height="170" class="node gap"/>
  <text x="1444" y="875" class="label">Access path fails</text>
  <text x="1444" y="918" class="body">Artifacts may still remain.</text>
  <text x="1444" y="952" class="body">Contain and investigate</text>
  <text x="1444" y="985" class="body">partial execution too.</text>

  <path d="M1109 998V1044" class="edge uncertain"/>
  <text x="1130" y="1030" class="small">If yes; success not established</text>
  <rect x="859" y="1054" width="500" height="115" class="node gap" stroke-dasharray="8 6"/>
  <text x="1109" y="1098" text-anchor="middle" class="label">Possible remote SSH access</text>
  <text x="1109" y="1137" text-anchor="middle" class="body">No confirmed attacker sessions in reviewed sources</text>

  <path d="M64 1204H1734" stroke="#d6dee7"/>
  <rect x="64" y="1227" width="18" height="18" rx="4" class="setup"/><text x="94" y="1243" class="small">Delivery</text>
  <rect x="205" y="1227" width="18" height="18" rx="4" class="execution"/><text x="235" y="1243" class="small">Execution / communication</text>
  <rect x="510" y="1227" width="18" height="18" rx="4" class="capability"/><text x="540" y="1243" class="small">Attempt / prerequisite</text>
  <rect x="787" y="1227" width="18" height="18" rx="4" class="gap"/><text x="817" y="1243" class="small">Boundary / outcome</text>
  <path d="M1060 1236H1110" class="edge uncertain"/><text x="1124" y="1243" class="small">Conditional, unconfirmed outcome</text>
  <text x="64" y="1285" class="small">Sources: Cursor incident notice and OpenSourceMalware analysis, reviewed October 30, 2026. Vendor reports attacker server taken offline.</text>
</svg>
