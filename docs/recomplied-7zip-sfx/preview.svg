<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">OpenSUpdater concealed in a recompiled 7-Zip SFX installer</title>
  <desc id="description">A signed 7-Zip SFX package runs a legitimate installer while hidden code contacts command-and-control infrastructure and loads a decrypted DLL into memory.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101923"/>
      <stop offset="1" stop-color="#202b35"/>
    </linearGradient>
    <linearGradient id="archive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#e09f3e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#background)"/>
  <circle cx="558" cy="58" r="94" fill="#263846" opacity=".45"/>
  <circle cx="72" cy="324" r="116" fill="#192f39" opacity=".65"/>

  <text x="40" y="50" fill="#ffffff" font-family="Georgia,serif" font-size="26">THE MALWARE IS IN THE STUB</text>
  <text x="42" y="77" fill="#7bdff2" font-family="monospace" font-size="12" letter-spacing="2.4">OPENSUPDATER / RECOMPILED 7-ZIP SFX</text>

  <g filter="url(#shadow)">
    <path d="M58 119h148l24 24v142H58z" fill="#f7f2e8"/>
    <path d="M206 119v27h24" fill="#d9d2c3"/>
    <rect x="83" y="143" width="84" height="84" rx="8" fill="url(#archive)"/>
    <rect x="119" y="143" width="13" height="84" fill="#101923"/>
    <path d="M119 155h13m-13 15h13m-13 15h13m-13 15h13" stroke="#f7f2e8" stroke-width="5"/>
    <text x="99" y="258" fill="#263846" font-family="monospace" font-size="17" font-weight="700">7z SFX</text>
    <circle cx="200" cy="260" r="23" fill="#3aaf85"/>
    <path d="m188 260 8 8 17-19" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="173" y="298" fill="#9eb0bc" font-family="monospace" font-size="10">VALID SIGNATURE</text>
  </g>

  <path d="M230 184h73" stroke="#76c893" stroke-width="5"/>
  <path d="m292 173 17 11-17 11" fill="#76c893"/>
  <rect x="312" y="137" width="122" height="91" rx="8" fill="#f7f2e8" filter="url(#shadow)"/>
  <rect x="328" y="153" width="90" height="13" rx="3" fill="#76c893"/>
  <rect x="328" y="176" width="70" height="8" rx="3" fill="#a8b5bd"/>
  <rect x="328" y="193" width="53" height="8" rx="3" fill="#a8b5bd"/>
  <text x="319" y="251" fill="#76c893" font-family="monospace" font-size="11">GENUINE SETUP.EXE</text>

  <path d="M229 226c68 0 45 83 130 83h40" fill="none" stroke="#ff5d73" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="m389 298 17 11-17 11" fill="#ff5d73"/>
  <circle cx="428" cy="309" r="29" fill="#8f2d56" filter="url(#shadow)"/>
  <path d="M414 311c0-13 9-22 22-22 10 0 18 5 22 14 10 0 18 7 18 16H414z" fill="#f7f2e8"/>

  <path d="M458 300c45-2 45-69 91-69" fill="none" stroke="#ff5d73" stroke-width="5"/>
  <path d="m538 220 17 11-17 11" fill="#ff5d73"/>
  <rect x="518" y="131" width="82" height="91" rx="10" fill="#351c2b" stroke="#ff5d73" stroke-width="3" filter="url(#shadow)"/>
  <path d="M533 153h52m-52 14h38m-38 14h46" stroke="#ffcfdf" stroke-width="4"/>
  <path d="M551 198h16m-8-8v16" stroke="#ff5d73" stroke-width="4"/>

  <text x="309" y="330" fill="#ff8fa3" font-family="monospace" font-size="10">HIDDEN C2 DOWNLOAD</text>
  <text x="504" y="251" fill="#ff8fa3" font-family="monospace" font-size="10">DLL IN MEMORY</text>
  <rect x="42" y="94" width="556" height="2" fill="#334956"/>
</svg>
