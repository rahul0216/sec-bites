<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">ROMULUS ClickFix platform threat research</title>
  <desc id="description">A fake verification prompt leads to PowerShell staging and branches into a sideloaded DLL route and a padded executable delivering LegionLoader.</desc>
  <defs>
    <radialGradient id="background" cx=".5" cy=".45" r=".8">
      <stop offset="0" stop-color="#26304d"/>
      <stop offset="1" stop-color="#080e1c"/>
    </radialGradient>
    <linearGradient id="delivery" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#83d9e8"/>
      <stop offset="1" stop-color="#f3b86b"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#background)"/>
  <g fill="none" stroke="#83d9e8" stroke-opacity=".07">
    <path d="M0 110h640M0 180h640M0 250h640M80 95v215M160 95v215M240 95v215M320 95v215M400 95v215M480 95v215M560 95v215"/>
    <circle cx="326" cy="194" r="99"/>
  </g>

  <g transform="translate(42 138)">
    <rect width="148" height="108" rx="9" fill="#12243a" stroke="#83d9e8" stroke-width="2"/>
    <path d="M0 24h148" stroke="#83d9e8" stroke-opacity=".4"/>
    <g fill="#83d9e8">
      <circle cx="13" cy="12" r="3"/>
      <circle cx="25" cy="12" r="3"/>
      <circle cx="37" cy="12" r="3"/>
    </g>
    <rect x="18" y="43" width="23" height="23" rx="3" fill="none" stroke="#f3b86b" stroke-width="2"/>
    <path d="m24 54 5 5 12-15" fill="none" stroke="#f3b86b" stroke-width="3"/>
    <path d="M56 49h72M56 61h54M18 85h110" stroke="#83d9e8" stroke-opacity=".6" stroke-linecap="round" stroke-width="4"/>
  </g>

  <g fill="none" stroke="url(#delivery)" stroke-linejoin="round" stroke-width="3">
    <path d="M190 192h61m-10-7 10 7-10 7"/>
    <path d="M371 192h26v-50h53m-10-7 10 7-10 7"/>
    <path d="M397 192v63h53m-10-7 10 7-10 7"/>
  </g>

  <rect x="255" y="153" width="116" height="78" rx="8" fill="#172942" stroke="#83d9e8" stroke-width="2"/>
  <path d="m276 175 17 16-17 16m28 0h26" fill="none" stroke="#f3b86b" stroke-linecap="round" stroke-width="4"/>

  <g fill="#211f34" stroke="#f3b86b" stroke-width="2">
    <rect x="454" y="111" width="144" height="64" rx="8"/>
    <rect x="454" y="222" width="144" height="64" rx="8"/>
  </g>
  <g fill="#f3b86b" font-family="monospace" font-size="12" text-anchor="middle">
    <text x="526" y="139">MSI / DLL</text>
    <text x="526" y="157" font-size="10">SIDELOADING</text>
    <text x="526" y="248">PADDED PE</text>
    <text x="526" y="268" font-size="10">LEGIONLOADER</text>
  </g>
  <g fill="#9ddde8" font-family="monospace" font-size="10" text-anchor="middle">
    <text x="116" y="267">FAKE VERIFICATION</text>
    <text x="313" y="254">POWERSHELL</text>
  </g>
  <text x="39" y="49" fill="#ffffff" font-family="Georgia,serif" font-size="29">ROMULUS</text>
  <text x="41" y="76" fill="#9ddde8" font-family="monospace" font-size="11" letter-spacing="2">CLICKFIX / MULTI-PAYLOAD DELIVERY PLATFORM</text>
  <text x="40" y="326" fill="#f3b86b" font-family="monospace" font-size="10" letter-spacing="2">TRUSTED LURE / USER EXECUTION / BRANCHED DELIVERY</text>
