<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">NetExec threat hunting research</title>
  <desc id="description">An abstract network of authentication paths converges on a defensive signal that represents behavior-led NetExec threat hunting.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1520"/>
      <stop offset=".55" stop-color="#132936"/>
      <stop offset="1" stop-color="#211c33"/>
    </linearGradient>
    <radialGradient id="signal" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#68e0bd" stop-opacity=".48"/>
      <stop offset=".45" stop-color="#68e0bd" stop-opacity=".12"/>
      <stop offset="1" stop-color="#68e0bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f8ca3" stop-opacity=".2"/>
      <stop offset=".65" stop-color="#68e0bd"/>
      <stop offset="1" stop-color="#ff6b87"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#background)"/>
  <circle cx="456" cy="210" r="178" fill="url(#signal)"/>

  <g fill="none" stroke="#7398aa" stroke-opacity=".15">
    <circle cx="456" cy="210" r="46"/>
    <circle cx="456" cy="210" r="83"/>
    <circle cx="456" cy="210" r="121"/>
    <path d="M335 210h242M456 89v242"/>
    <path d="m370 124 172 172m0-172L370 296"/>
  </g>

  <g fill="none" stroke="url(#path)" stroke-linecap="round">
    <path d="M62 131c109 0 134 36 207 36s100 43 187 43" stroke-width="3"/>
    <path d="M81 203c99 0 121-13 191-13s99 20 184 20" stroke-width="5"/>
    <path d="M54 274c111 0 142-51 219-51s105-13 183-13" stroke-width="3"/>
    <path d="M141 99c52 28 64 84 127 91" stroke-width="2" stroke-dasharray="5 9"/>
    <path d="M154 295c45-34 72-66 119-72" stroke-width="2" stroke-dasharray="5 9"/>
  </g>

  <g fill="#0e1c27" stroke="#75a9bc" stroke-width="2">
    <circle cx="62" cy="131" r="10"/>
    <circle cx="81" cy="203" r="14"/>
    <circle cx="54" cy="274" r="8"/>
    <circle cx="141" cy="99" r="7"/>
    <circle cx="154" cy="295" r="7"/>
    <circle cx="269" cy="167" r="8"/>
    <circle cx="272" cy="190" r="11"/>
    <circle cx="273" cy="223" r="8"/>
  </g>

  <g fill="#68e0bd" filter="url(#glow)">
    <circle cx="62" cy="131" r="3"/>
    <circle cx="81" cy="203" r="4"/>
    <circle cx="54" cy="274" r="3"/>
    <circle cx="141" cy="99" r="2.5"/>
    <circle cx="154" cy="295" r="2.5"/>
    <circle cx="269" cy="167" r="3"/>
    <circle cx="272" cy="190" r="4"/>
    <circle cx="273" cy="223" r="3"/>
  </g>

  <g transform="translate(456 210)" filter="url(#glow)">
    <path d="M0-40 35-25v26c0 24-13 41-35 53C-22 42-35 25-35 1v-26Z" fill="#102c33" stroke="#68e0bd" stroke-width="3"/>
    <path d="m-15 2 10 10L18-13" fill="none" stroke="#d9fff4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g fill="#ff6b87" filter="url(#glow)">
    <circle cx="505" cy="143" r="5"/>
    <circle cx="539" cy="210" r="6"/>
    <circle cx="499" cy="286" r="5"/>
  </g>
  <g fill="none" stroke="#ff6b87" stroke-opacity=".7">
    <path d="M505 143 456 210l83 0-40 76Z" stroke-width="1.5" stroke-dasharray="4 7"/>
  </g>

  <text x="42" y="51" fill="#ffffff" font-family="Georgia,serif" font-size="26">NETEXEC</text>
  <text x="42" y="77" fill="#b7c9d2" font-family="monospace" font-size="12" letter-spacing="3">THREAT HUNTING RESEARCH</text>
  <text x="42" y="333" fill="#68e0bd" font-family="monospace" font-size="10" letter-spacing="2">FOLLOW THE BEHAVIOR, NOT THE BINARY</text>
</svg>
